name: nightly-integration

on:
  schedule:
    # Run at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-integration
  cancel-in-progress: true

jobs:
  full-test-suite:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "agent/agent/requirements.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/agent/requirements.txt

      - name: Install Edge browser
        run: npx playwright install msedge

      - name: Run full test suite (JS + Python)
        run: npm run test:all

      - name: Run MCP preflight checks
        run: npm run mcp:preflight

      - name: Run live MCP integration tests
        env:
          RUN_MCP_LIVE_TESTS: "1"
        run: npm run test:py:integration

      - name: Generate health snapshot
        if: always()
        run: npm run health:snapshot:quiet

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-artifacts
          path: |
            logs/health/*.md
            logs/mcp-live/**
          retention-days: 14
