name: live-web-governance-check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'index.js'
      - 'playwright-edge-mcp.js'
      - 'edge-session.js'
      - 'cli-agent.js'
      - 'nl-command-parser.js'
      - 'scripts/**/*.js'
      - '.vscode/mcp.json'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'index.js'
      - 'playwright-edge-mcp.js'
      - 'edge-session.js'
      - 'cli-agent.js'
      - 'nl-command-parser.js'
      - 'scripts/**/*.js'
      - '.vscode/mcp.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: live-web-governance-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-web-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright runtime syntax checks
        run: npm run check

      - name: Validate live-web governance structure and frontmatter
        run: node scripts/validate-governance.js